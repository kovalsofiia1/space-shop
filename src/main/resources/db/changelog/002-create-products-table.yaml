databaseChangeLog:
  - changeSet:
      id: "002-create-products-table"
      author: "author"
      changes:
        - createTable:
            tableName: "products"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
              - column:
                  name: "category_id"
                  type: "UUID"
                  constraints:
                    nullable: false
                    foreignKeyName: "fk_products_category"
                    references: "categories(id)"
              - column:
                  name: "name"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "VARCHAR(255)"
              - column:
                  name: "price"
                  type: "DECIMAL(10, 2)"
                  constraints:
                    nullable: false
              - column:
                  name: "stock_quantity"
                  type: "INTEGER"
                  constraints:
                    nullable: false
              - column:
                  name: "sku"
                  type: "VARCHAR(50)"
                  constraints:
                    nullable: false
