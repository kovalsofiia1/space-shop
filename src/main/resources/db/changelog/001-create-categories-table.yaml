databaseChangeLog:
  - changeSet:
      id: "001-create-categories-table"
      author: "author"
      changes:
        - createTable:
            tableName: "category"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
              - column:
                  name: "name"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "VARCHAR(255)"
