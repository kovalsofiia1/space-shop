databaseChangeLog:
  - changeSet:
      id: "003-create-customers-table"
      author: "author"
      changes:
        - createTable:
            tableName: "customer"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
              - column:
                  name: "name"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "email"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: "phone_number"
                  type: "VARCHAR(15)"
              - column:
                  name: "address"
                  type: "VARCHAR(255)"
