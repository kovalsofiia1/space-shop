databaseChangeLog:
  - changeSet:
      id: "005-create-order-entries-table"
      author: "author"
      changes:
        - createTable:
            tableName: "order_entries"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
              - column:
                  name: "order_id"
                  type: "UUID"
                  constraints:
                    nullable: false
                    foreignKeyName: "fk_order_entries_order"
                    references: "orders(id)"
              - column:
                  name: "product_id"
                  type: "UUID"
                  constraints:
                    nullable: false
                    foreignKeyName: "fk_order_entries_product"
                    references: "products(id)"
              - column:
                  name: "quantity"
                  type: "INTEGER"
                  constraints:
                    nullable: false
