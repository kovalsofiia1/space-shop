databaseChangeLog:
  - changeSet:
      id: "005-create-order-entries-table"
      author: "author"
      changes:
        - createTable:
            tableName: "order_entry"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
              - column:
                  name: "order_id"
                  type: "UUID"
                  constraints:
                    nullable: false
                    foreignKeyName: "fk_order_entry_order"
                    references: "order(id)"
              - column:
                  name: "product_id"
                  type: "UUID"
                  constraints:
                    nullable: false
                    foreignKeyName: "fk_order_entry_product"
                    references: "product(id)"
              - column:
                  name: "quantity"
                  type: "INTEGER"
                  constraints:
                    nullable: false
