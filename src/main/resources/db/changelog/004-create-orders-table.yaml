databaseChangeLog:
  - changeSet:
      id: "004-create-orders-table"
      author: "author"
      changes:
        - createTable:
            tableName: "orders"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
              - column:
                  name: "customer_id"
                  type: "UUID"
                  constraints:
                    nullable: false
                    foreignKeyName: "fk_orders_customer"
                    references: "customers(id)"
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  constraints:
                    nullable: false
